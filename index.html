<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#001f3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AGC Connect">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<title>AGC Connect</title>
</head>
<body>
<div id="gate" hidden>
  <div class="gate-box">
    <img src="assets/logo-full.png" alt="Awakening Generations Church" class="gate-logo">
    <button class="btn small ghost langtog">नेपाली</button>
    <h1>AGC Connect</h1>
    <label for="pw">Church password</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn" id="pwgo">Enter</button>
    <div id="pwmsg" class="bad"></div>
  </div>
</div>

<div id="auth" hidden>
  <div class="gate-box">
    <img src="assets/logo-full.png" alt="Awakening Generations Church" class="gate-logo">
    <button class="btn small ghost langtog">नेपाली</button>
    <h1>Welcome</h1>
    <p>Parents: sign in to keep your family's progress safe.</p>
    <div class="seg"><button class="btn small" id="au-in">Sign in</button><button class="btn small ghost" id="au-up">Create account</button></div>
    <label for="em">Email</label>
    <input id="em" type="email" autocomplete="email" inputmode="email">
    <label for="pw2">Password</label>
    <input id="pw2" type="password" autocomplete="current-password">
    <div id="au-consent" hidden><label class="chk"><input type="checkbox" id="au-ck"> I am a parent or guardian, or I am 13 or older.</label></div>
    <button class="btn" id="au-go">Sign in</button>
    <button class="btn ghost small" id="au-forgot">Forgot password?</button>
    <div id="au-msg" aria-live="polite"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="top-l"><button class="btn small ghost hb" id="homebtn" hidden>← Home</button></div>
    <button class="brandlink" id="brandlink" aria-label="AGC Connect. Go to the Home screen"><img src="assets/emblem.png" alt="" class="top-logo"><span class="brand">AGC <span>Connect</span></span></button>
    <div class="top-r"><button class="btn small ghost langtog" id="langbtn">नेपाली</button><button class="btn small ghost so" id="signout" hidden>Sign out</button></div>
  </header>
  <nav class="inner" id="inner" aria-label="Section tabs"></nav>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs" aria-label="Main sections"></nav>
</div>

<script src="app.js"></script>
</body>
</html>
